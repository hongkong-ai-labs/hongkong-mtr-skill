[package]
name = "mtr-hk-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Hong Kong MTR MCP server and CLI: live status, traffic news, next trains, routes, fares, Light Rail, MTR Bus and ferries"
license = "MIT"
repository = "https://github.com/hongkong-ai-labs/hongkong-mtr-skill"

[lib]
name = "mtr_hk"
path = "src/lib.rs"

[[bin]]
name = "mtr-hk-mcp"
path = "src/bin/mtr-hk-mcp.rs"

[[bin]]
name = "mtr-hk"
path = "src/bin/mtr-hk.rs"

[[bin]]
name = "mtr-hk-mcp-http"
path = "src/bin/mtr-hk-mcp-http.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
futures = "0.3"
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "charset"] }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
